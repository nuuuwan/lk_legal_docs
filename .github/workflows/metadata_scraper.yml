name: metadata_scraper

on:
  workflow_dispatch:
    inputs:
      max_delta_t:
        description: "max_delta_t"
        required: false
        default: "1"
  schedule:
    - cron: "30 * * * *"

jobs:
  metadata_scraper:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nuuuwan/lk-legal-docs-downloader:latest

    steps:
      - name: "⬇️ Checkout lk_legal_docs"
        uses: actions/checkout@v4
        with:
          ref: "main"
          token: "${{ secrets.REPO_DATA_TOKEN }}"

      - name: "⚙️ Run metadata_scraper"
        run: |
          export PYTHONPATH="$PYTHONPATH:./src"

          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"

          git pull origin main --rebase
          python workflows/metadata_scraper.py ${{ github.event.inputs.max_delta_t }}

      - name: "⬆️ Push lk_legal_docs"
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "🤖 [metadata_scraper.yml] $(date '+%Y-%m-%d-%H%M')"
          git pull origin main --rebase
          git push origin main
