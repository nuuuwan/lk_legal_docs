name: build_readme

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

jobs:
  build_readme:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nuuuwan/lk-legal-docs-downloader:latest

    steps:
      - name: "⬇️ Checkout lk_legal_docs"
        uses: actions/checkout@v4
        with:
          ref: "main"
          token: "${{ secrets.REPO_DATA_TOKEN }}"

      - name: "⚙️ Run build_readme"
        run: |
          export PYTHONPATH="$PYTHONPATH:./src"

          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"
          git config --global --add safe.directory /__w/lk_legal_docs/lk_legal_docs

          git pull origin main --rebase
          python workflows/build_readme.py ${{ github.event.inputs.max_delta_t }}

      - name: "⬆️ Push lk_legal_docs"
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "🤖 [build_readme.yml] $(date '+%Y-%m-%d-%H%M')"
          git pull origin main --rebase
          git push origin main
