name: data_downloader

on:
  workflow_dispatch:
    inputs:
      max_delta_t:
        description: "max_delta_t"
        required: false
        default: "1"
  schedule:
    - cron: "10 * * * *"

jobs:
  data_downloader:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        decade: ["1980s", "1990s", "2000s", "2010s", "2020s"]

    steps:
      - name: "🧹 Free up disk space"
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/hostedtoolcache/CodeQL     
          sudo docker system prune -af    
          sudo apt-get

      - name: "⬇️ Checkout lk_legal_docs"
        uses: actions/checkout@v4
        with:
          ref: "main"
          token: "${{ secrets.REPO_DATA_TOKEN }}"

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: 🐍 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 🐍 Install dependencies
        run: |
          sudo apt update
          sudo apt install ghostscript
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install build
          pip cache purge
          rm -rf ~/.cache/pip

      - name: "⬇️ Checkout lk_legal_docs_data 🛢️"
        run: |
          BRANCH="data_${{ matrix.decade }}"
          echo "BRANCH=$BRANCH"
          git clone --branch $BRANCH --single-branch --depth 1 https://x-access-token:${{ secrets.REPO_DATA_TOKEN }}@github.com/nuuuwan/lk_legal_docs_data /tmp/lk_legal_docs_data/

      - name: "⚙️ Run data_downloader"
        run: |
          export PYTHONPATH="$PYTHONPATH:./src"
          MAX_DELTA_T="${{ github.event.inputs.max_delta_t }}"
          [ -z "$MAX_DELTA_T" ] && MAX_DELTA_T="1200"

          echo "MAX_DELTA_T=$MAX_DELTA_T"
          echo "matrix.decade=${{ matrix.decade }}"

          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"

          python workflows/data_downloader.py --max_delta_t $MAX_DELTA_T --decade ${{ matrix.decade }}

      - name: "🧪Check disk usage"
        run: df -h

      - name: "⬆️ Push lk_legal_docs_data 🛢️"
        run: |
          BRANCH="data_${{ matrix.decade }}"
          cd /tmp/lk_legal_docs_data/
          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"

          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit in lk_legal_docs_data."
            exit 0
          fi
          git commit -m "🤖 [data_downloader.yml] $(date '+%Y-%m-%d-%H%M')"
          git pull origin $BRANCH --rebase
          git push origin $BRANCH
